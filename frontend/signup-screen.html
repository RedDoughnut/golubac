<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golubac</title>
</head>
<body>
    <div class="container">
        <h1>Sign up</h1>
    </div>

    <div class="container">
        <div>
            <input type="text" id="fname" name="fname" placeholder="Enter first name">
        </div>

        <div>
            <input type="text" id="lname" name="lname" placeholder="Enter last name">
        </div>

        <div>
            <input type="text" id="mail" name="mail" placeholder="Enter email">
        </div>

        <div>
            <input type="text" id="username" name="username" placeholder="Enter Username">
        </div>
        
        <div>
            <input type="password" id="pwd1" name="pwd1" placeholder="Enter password">
        </div>

        <div>
            <input type="password" id="pwd2" name="pwd2" placeholder="Enter password again">
        </div>

        <div>
            <p id="error"></p>
        </div>
        
        <div>
            <button onclick="getSignUpData()">Sign up</button>
        </div>
    </div>
</body>
</html>
