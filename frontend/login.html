<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="bg-wrapper"></div>

    <main class="app-screen">
        <header class="app-header">
            <div class="app-badge">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <h1>Welcome back</h1>
            <p>Log in to your account to start messaging</p>
        </header>

        <form class="login-form" onsubmit="event.preventDefault(); login();">
            <div class="field-container">
                <div class="input-field">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="input-field">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="pwd" name="pwd" placeholder="Password" required autocomplete="current-password">
                </div>
            </div>

            <p id="error" class="error-msg" role="alert"></p>

            <button type="submit" class="loginBtn">Log In</button>
        </form>

        <footer class="app-footer">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </footer>
    </main>
</body>
</html>
